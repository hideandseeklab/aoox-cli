name: Publish to npm

# Runs on every version tag (v0.1.0-alpha.0, v1.2.3, ...). package.json's
# `version` is the source of truth: `npm version <x>` bumps it and creates the
# matching tag; `git push --follow-tags` sends both to GitHub, which triggers
# this workflow.
#
# Authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. This
# only works once the `aoox` package exists on npm AND has this exact repo +
# workflow filename registered under its "Trusted publishing" settings on
# npmjs.com. Until that's set up, the very first publish must be done manually
# from a machine with npm 2FA (`npm publish --tag latest`) — see RELEASING.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; the version bundled with
      # a given Node release isn't guaranteed to meet that yet.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Dist-tag policy. A stable version always publishes as "latest". While no
      # stable version of the package has ever been published, every pre-release
      # (alpha, beta, rc, ...) also publishes as "latest", so a plain
      # `npm i -g @hideandseeklab/aoox` gets the newest one. Once a stable version
      # exists, a pre-release publishes under its own channel tag (beta, rc, ...)
      # and never takes "latest". Whether a stable version exists is read from the
      # public registry (no auth); a failed lookup fails the job instead of guessing.
      # Trusted Publishing (OIDC) may only publish, not move tags, so there is no
      # `npm dist-tag add` step. npm needs an explicit --tag to publish a
      # pre-release under "latest".
      - name: Derive npm dist-tag from version
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            LABEL=$(echo "$VERSION" | sed -E 's/^[^-]+-([a-zA-Z]+).*/\1/')
            NAME=$(node -p "require('./package.json').name")
            # 404 = package never published: no stable version exists. Any other
            # failure (network, 5xx) must not be mistaken for that.
            CODE=$(curl -sS -o versions.json -w '%{http_code}' "https://registry.npmjs.org/${NAME/\//%2f}" -H 'accept: application/vnd.npm.install-v1+json') || { echo "::error::npm registry lookup failed"; exit 1; }
            if [[ "$CODE" == "404" ]]; then
              HAS_STABLE=false
            elif [[ "$CODE" == "200" ]]; then
              HAS_STABLE=$(node -e '
                const doc = JSON.parse(require("fs").readFileSync("versions.json", "utf8"));
                const versions = Object.keys(doc.versions ?? {});
                console.log(versions.some((v) => !v.includes("-")));
              ')
            else
              echo "::error::npm registry answered HTTP $CODE"; exit 1
            fi
            rm -f versions.json
            if [[ "$HAS_STABLE" == "true" ]]; then
              TAG="$LABEL"
            else
              TAG="latest"
            fi
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION under dist-tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --tag ${{ steps.tag.outputs.tag }}
