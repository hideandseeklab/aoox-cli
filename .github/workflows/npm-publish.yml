name: Publish to npm

# Runs on every version tag (v0.1.0-alpha.0, v1.2.3, ...). package.json's
# `version` is the source of truth: `npm version <x>` bumps it and creates the
# matching tag; `git push --follow-tags` sends both to GitHub, which triggers
# this workflow.
#
# Authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. This
# only works once the `aoox` package exists on npm AND has this exact repo +
# workflow filename registered under its "Trusted publishing" settings on
# npmjs.com. Until that's set up, the very first publish must be done manually
# from a machine with npm 2FA (`npm publish --tag latest`) — see RELEASING.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; the version bundled with
      # a given Node release isn't guaranteed to meet that yet.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Dist-tag policy. A stable version (1.0.0) publishes as "latest". While the
      # project is in alpha, every alpha publishes as "latest", the only tag we
      # use, so a plain `npm i -g @hideandseeklab/aoox` gets the newest alpha.
      # There is no separate "alpha" tag: Trusted Publishing may only publish, not
      # move tags, so a second tag would go stale. Other pre-release labels (beta,
      # rc) keep their own tag and never take "latest".
      # npm needs an explicit --tag to publish a pre-release under "latest".
      - name: Derive npm dist-tag from version
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            LABEL=$(echo "$VERSION" | sed -E 's/^[^-]+-([a-zA-Z]+).*/\1/')
            if [[ "$LABEL" == "alpha" ]]; then
              TAG="latest"
            else
              TAG="$LABEL"
            fi
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION under dist-tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --tag ${{ steps.tag.outputs.tag }}
