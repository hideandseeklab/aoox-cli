name: Publish to npm

# Runs on every version tag (v0.1.0-alpha.0, v1.2.3, ...). package.json's
# `version` is the source of truth: `npm version <x>` bumps it and creates the
# matching tag; `git push --follow-tags` sends both to GitHub, which triggers
# this workflow.
#
# Authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. This
# only works once the `aoox` package exists on npm AND has this exact repo +
# workflow filename registered under its "Trusted publishing" settings on
# npmjs.com. Until that's set up, the very first publish must be done manually
# from a machine with npm 2FA (`npm publish --tag alpha`) — see RELEASING.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; the version bundled with
      # a given Node release isn't guaranteed to meet that yet.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Dist-tag policy. A stable version (1.0.0) publishes as "latest". While the
      # project is in alpha, every alpha publishes as "latest" TOO, so a plain
      # `npm i -g @hideandseeklab/aoox` (no tag) gets the newest alpha instead of
      # a stale one; the "alpha" tag is kept in step (see the next step). Other
      # pre-release labels (beta, rc) keep their own tag and never take "latest".
      # npm needs an explicit --tag to publish a pre-release under "latest".
      - name: Derive npm dist-tag from version
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXTRA=""
          if [[ "$VERSION" == *-* ]]; then
            LABEL=$(echo "$VERSION" | sed -E 's/^[^-]+-([a-zA-Z]+).*/\1/')
            if [[ "$LABEL" == "alpha" ]]; then
              TAG="latest"
              EXTRA="alpha"
            else
              TAG="$LABEL"
            fi
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION under dist-tag $TAG (extra tag: ${EXTRA:-none})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --tag ${{ steps.tag.outputs.tag }}

      # Trusted publishing (OIDC) authorizes `npm publish` only, so this may be
      # refused; it is best effort. If it fails, run by hand:
      #   npm dist-tag add @hideandseeklab/aoox@<version> alpha
      # `aoox update` takes the newest of "latest" and "alpha", so a stale
      # "alpha" tag never holds users back.
      - name: Keep the alpha tag in step
        if: steps.tag.outputs.extra != ''
        continue-on-error: true
        run: npm dist-tag add @hideandseeklab/aoox@${{ steps.tag.outputs.version }} ${{ steps.tag.outputs.extra }}
